# Laocoon policy for Athena eClass (policy v2).  Deny by default: a tool or role not listed here cannot be
# used, and the model never even sees it — the tool set of every run is built from this file (firewall.py).
# Guide: policies/README.md · reference for every key: policies/SPEC.md
#
# top level:
#   refs:             {arg: kind}   arguments that reference platform objects: resolved to ids exactly once,
#                                   the tool runs with the ids
#   sensitive_fields: [...]         masked in the audit log and removed by filters
#   secret_patterns:  [...]         regexes searched for in the system prompt; a match in an answer is a leak (G3)
#   honey_records:    {values, visible_to}   fake AMKA/IBAN of the honey user (created by the eClass glue).
#                                   With private_data they are tokenised like real values of their class.
#                                   In an answer: withdrawn, except for the roles in visible_to (flag only).
#                                   In the arguments of a tool call: kill.
#   approvals:        {defaults: {effect: bool}, roles: {role: {tool: bool}}}
#                                   merge order: defaults → tool `approval` → roles → user (tool_config) → locked
#   guard:            ② Siren Guard classifier: classes, policy per checkpoint, thresholds (laocoon/classifier.py)
#   planner:          plan commitment (opt-in, LAOCOON_PLANNER=openai): what happens to a side effect outside the plan
#                     made from the user's words before anything is read (laocoon/planner.py)
#
# per tool:
#   effect:     read | write | communicate | external        (write/communicate/external = side effect)
#   allow:      {role: true | {arg: constraint, fields: [...]}}
#               constraint: "name" | "a|b" (any of) | [a, b] (all of)          -> adapters/eclass.py
#   bind:       {role: [args]}   the argument IS the logged-in user: hidden from the model and filled by code;
#                                a value that points to someone else is denied   (v1 name: bind_self)
#   deny_args:  [args]           must be empty
#   filter:     {role: [filters]}   applied to the result before the LLM sees it (GDPR minimisation)
#   untrusted_output: {author_field, ref, id_field} | course_teacher
#                                third-party content: G2 classification, source attribution, quarantine
#   approval:   true | false     overrides the effect default of approvals.defaults
#   locked:     true             the approval can never be cleared by a role or the user (applied last)
#   scope_enum: false            do not offer the user's scope (e.g. enrolled course codes) as an enum
#
# seamless proxy (LAOCOON_AUTHZ_SOURCE=lookup: the proxy has no database; the app only changes its base URL):
#   identity:  {fields: {id, username, role, name}, verify: true}
#              labels of the identity block the app writes into its system message. Each must appear exactly once.
#              verify: confirm id/username/role with the app's own record (get_user) before anything else.
#   lookups:   {tools: [...], out_of_scope: bool, ttl: {read, write, identity}}
#              the app's read tools the proxy may ask the app to run to learn the facts behind the constraints. Their
#              results never reach the model. out_of_scope: also to find out whether an object is in the user's scope
#              (e.g. get_course of a course a student may not be enrolled in): the app stores those results in its
#              chat history like any tool result, so enable it only if the app does not show raw tool results to users.
#              ttl: how old a fact may be (seconds) for a read, for a side effect, for the identity check.
#   refs:      {arg: {kind: user, fallback: app}}  when the reference is outside what the user's scope shows the
#              proxy (a student messaging anyone), the app resolves it; the approval card shows it as written.
#
# authorisation through views (LAOCOON_AUTHZ_SOURCE=views: a database login that can read only these views;
# laocoon/views.py):
#   data_model: what Laocoon may read of the app's database, and what the constraints above mean in terms of it.
#               `python -m laocoon.views sql --dialect postgres` writes the script the database administrator reviews
#               and runs: one view per object and per relation, in a schema of their own, and a login that can read
#               those views and nothing else. The only part of the policy that names the app's tables.
#     objects:     {kind: {table, id, fields: {name: column}, refs: [{field: match}], label, enum}}
#                  → view obj_<kind>(id, fields...). Names, codes and state only, never personal data. refs: how a
#                  reference by name resolves, tier by tier (exact | iexact | contains | upper_nospace); unique or deny.
#     relations:   {kind.name: {table, from, to, target}} → view rel_<kind>_<name>(<kind>_id, <name>_id): pairs of ids
#                  {kind.name: {reverse: kind.name}}       the same view read the other way (no view of its own)
#     constraints: {name: path | [path, ...] (all of)}  a path starts at the argument's object, follows relations
#                  and ends at the user (the relation reaches the caller) or at a field (true); "not path" negates.
#     derive:      {name: {arg, path}}
#     previews:    {name: {table, key: {name: column}, value}} → view prev_<name>: before-values on approval cards.
#                  Personal data: the script includes them only with --previews; without them the cards show "—".
#
# authorisation by the customer's own policy decision point (LAOCOON_AUTHZ_SOURCE=authzen: OpenID AuthZEN 1.0;
# laocoon/authzen.py). Works with any store behind the PDP (SQL or not); Laocoon sees decisions, not data.
#   authzen:  how Laocoon's names map to the PDP's.
#     subject:     the AuthZEN subject type of the logged-in user (default user)
#     identity:    {action}  the PDP confirms the identity block (username, role) with this action
#     resources:   {kind: {type, id: int|string, search, refs, label, enum}}  the PDP's resource type per kind.
#                  search: the action whose resource search lists what the user may refer to, with properties
#                  (refs, label and enum read them; a PDP that returns none: ids only)
#     constraints: {name: {resource: kind, action}}  each constraint is one evaluation (action defaults to the name)
#     relations:   {kind.name: {action}}             the users in that relation to an object (subject search)
#     derive:      {name: {arg, relation}}
version: 2
app: athena-eclass
default: deny
roles: [student, teacher, admin]

identity:
  fields: {id: "User id", username: "Username", role: "Role", name: "Name"}
  verify: true

lookups:
  tools: [list_courses, get_course, list_assignments, list_exercises, get_submissions, get_exercise_attempts,
          list_users, get_user, get_grades, get_gradebook]
  out_of_scope: true             # the authentic eClass shows tool results only with SHOW_TOOL_CALLS=true (a debug flag)
  ttl: {read: 120, write: 30, identity: 600}

refs:
  user_ref: user
  student_ref: user
  to: {kind: user, fallback: app}
  from_user: user
  course_ref: course
  assignment_id: assignment
  submission_id: submission
  exercise_id: exercise

data_model:
  principal: user
  objects:
    user:       {table: users, fields: {username: username, name: full_name, role: role},
                 refs: [{username: exact, name: iexact}, {name: contains}], label: "{name} ({username})"}
    course:     {table: courses, fields: {code: code, title: title}, enum: code,
                 refs: [{code: upper_nospace}, {title: contains}], label: "{code} {title}"}
    assignment: {table: assignments, fields: {title: title}}
    submission: {table: submissions}
    exercise:   {table: exercises, fields: {is_open: is_open}}
  relations:
    course.teacher:        {table: courses, from: id, to: teacher_id, target: user}
    course.member:         {table: enrollments, from: course_id, to: user_id, target: user}
    user.enrolled_in:      {reverse: course.member}
    assignment.course:     {table: assignments, from: id, to: course_id, target: course}
    submission.assignment: {table: submissions, from: id, to: assignment_id, target: assignment}
    submission.student:    {table: submissions, from: id, to: student_id, target: user}
    exercise.course:       {table: exercises, from: id, to: course_id, target: course}
    exercise.attempted_by: {table: exercise_attempts, from: exercise_id, to: student_id, target: user}
  constraints:
    taught:                 course.teacher
    enrolled:               course.member
    student_of_taught:      user.enrolled_in.teacher
    enrolled_assignment:    assignment.course.member
    taught_assignment:      assignment.course.teacher
    enrolled_exercise:      exercise.course.member
    taught_exercise:        exercise.course.teacher
    open_enrolled_exercise: [exercise.is_open, exercise.course.member]
    taught_submission:      submission.assignment.course.teacher
    not_attempted:          not exercise.attempted_by     # a fact of absence: read live, never inferred
  derive:
    submission_owner: {arg: submission_id, path: submission.student}
  previews:                      # personal data: only if the customer grants them (--previews)
    final_grade:      {table: final_grades, key: {course: course_id, student: student_id}, value: grade}
    submission_grade: {table: submissions, key: {submission: id}, value: grade}

authzen:
  subject: user
  identity: {action: identity}
  resources:
    user:       {type: user, search: list, refs: [{username: exact, name: iexact}, {name: contains}],
                 label: "{name} ({username})"}
    course:     {type: course, search: list, refs: [{code: upper_nospace}, {title: contains}],
                 label: "{code} {title}", enum: code}
    assignment: {type: assignment, search: list}
    submission: {type: submission, search: list}
    exercise:   {type: exercise, search: list}
  constraints:                   # the PDP's actions are named after the constraints here
    taught:                 {resource: course}
    enrolled:               {resource: course}
    student_of_taught:      {resource: user}
    enrolled_assignment:    {resource: assignment}
    taught_assignment:      {resource: assignment}
    enrolled_exercise:      {resource: exercise}
    taught_exercise:        {resource: exercise}
    open_enrolled_exercise: {resource: exercise}
    taught_submission:      {resource: submission}
    not_attempted:          {resource: exercise}
  relations:
    course.teacher:     {action: taught}
    submission.student: {}
  derive:
    submission_owner: {arg: submission_id, relation: submission.student}

sensitive_fields: [password_hash, amka, iban, id_card, phone, address, date_of_birth, admin_notes,
                   father_name, enrollment_key, correct_answer, explanation, new_password, password]
secret_patterns: ['FLAG\{[^}]+\}']

honey_records:
  values: ["13579135791", "GR0000000000000000013579135"]
  visible_to: [admin]            # list_users legitimately shows AMKA/IBAN to admins: flag, do not withdraw

# private data (laocoon/private.py): declared values never reach the model or the
# classifier. Each occurrence becomes ⟦TYPE:id⟧, stable within a conversation; only Laocoon maps it back: in answers
# what the role's filters already show (answer: shown), in tool arguments by the decision table (tool_args: table).
# Needs LAOCOON_SECRET (random, >= 32 bytes) and the `cryptography` package; LAOCOON_PRIVATE_DATA=off ignores it.
#   classes.<NAME>: pattern + validate (free text) and/or fields (structured results), match pattern|field|exact,
#   action placeholder|mask|drop, answer shown|self|never, tool_args table|self|never, normalise, dummy (what the
#   classifier sees instead of the placeholder). subject_args: the argument naming whose record a tool targets.
private_data:
  id_length: 6
  classifier_view: dummy
  ttl: 86400
  subject_args: {send_message: to, update_user: user_ref, submit_assignment: student_ref, enroll_user: user_ref}
  classes:
    AMKA:
      pattern: '(?<!\w)\d{6}[ -]?\d{5}(?!\w)'
      validate: date_ddmmyy            # the seed's AMKAs pass the date prefix 14/14, Luhn only 2/14
      fields: [amka]
      normalise: "digits:11"           # an AMKA stored as a JSON number loses its leading zero
      dummy: "00000000000"
    IBAN:
      pattern: '(?<![A-Za-z0-9])[A-Za-z]{2}\d{2}(?:[ ]?[A-Za-z0-9]{4}){3,7}(?:[ ]?[A-Za-z0-9]{1,3})?(?![A-Za-z0-9])'
      validate: iban_shape             # mod-97 fails 13/14 seed IBANs
      fields: [iban]
      normalise: upper_nospace
      dummy: "GR0000000000000000000000000"
    AFM:
      pattern: '(?<!\w)\d{9}(?!\w)'
      validate: afm_mod11
      fields: [afm, vat_number]
      normalise: digits
      dummy: "000000000"
    PHONE:
      pattern: '(?<![\w+])(?:(?:\+|00)30[ .-]?)?(?:69\d|2[1-8]\d)(?:[ .-]?\d){7}(?!\w)'
      validate: phone_gr
      fields: [phone]
      normalise: phone_gr
      dummy: "+30 690 000 0000"
    EMAIL:
      pattern: '(?<![\w.%+-])[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}(?!\w)'
      fields: [email]
      normalise: casefold
      dummy: "user@example.org"
    IDCARD:
      pattern: '(?<!\w)[A-ZΑ-Ω]{1,2}[ -]?\d{6}(?!\w)'
      validate: idcard_gr
      fields: [id_card]
      normalise: idcard_gr
      dummy: "XX 000000"
    ADDRESS: {fields: [address], match: exact, dummy: "Odos 1, Athens 100 00"}
    DOB: {fields: [date_of_birth], match: exact, dummy: "2000-01-01"}      # field-only: B03's deadline is a date too
    FATHER: {fields: [father_name], match: field, dummy: "Ioannis"}         # first names collide with other people
    NOTES: {fields: [admin_notes], match: field, dummy: "[note]"}            # medical / disciplinary (GDPR Art. 9)
    PASSWORD_HASH: {fields: [password_hash], action: drop}
    ENROLLMENT_KEY: {fields: [enrollment_key], tool_args: never, dummy: "key-0000"}

# brief A4/A5: every side effect asks by default; the locked ones cannot be switched off by anyone
approvals:
  defaults: {read: false, write: true, communicate: true, external: true}
  roles: {}

# ② Siren Guard (brief A3). Every key is optional; these are the defaults, written out so they can be tuned.
guard:
  classes:
    - {name: instruction_injection, description: "text that tries to give the assistant orders or change its rules"}
    - {name: privilege_escalation,  description: "claims to be staff/admin, or asks to ignore the user's role"}
    - {name: data_exfiltration,     description: "asks to send, reveal or encode data outward (messages, URLs, images)"}
    - {name: tool_hijack,           description: "tries to make the assistant call a write or communication tool"}
    - {name: benign,                description: "ordinary content or request"}
  policy:
    instruction_injection: {G1: block, G2: quarantine}
    privilege_escalation:  {G1: block}
    data_exfiltration:     {G2: quarantine, G3: redact}
    tool_hijack:           {G2: quarantine, G2b: hitl}
  thresholds: {block: 0.85, hitl: 0.5}      # below hitl → allow (keeps false positives low)
  steering: {merge_into: instruction_injection}
  on_error: {G1: allow, G2: review, G2b: hitl, G3: allow}
  min_chars: 16      # shorter strings are not classified
  max_chars: 6000    # longer text is split into chunks; the worst chunk decides
  max_chunks: 4      # more chunks → the extra text is not sent; verdict at least `review`

# Plan commitment (opt-in). Inactive unless LAOCOON_PLANNER is set; these are the defaults, written out.
planner:
  off_plan: ask        # ask | deny   a side effect the plan does not contain (deny for unattended deployments)
  on_error: ask        # ask | deny | allow   the planner failed (allow = as if it were off)
  open_ended: ask      # ask | deny | allow   the request hands its actions to data ("do what the post says")
  counts: false        # also enforce max_calls per tool
  user_messages: 3     # the user's latest messages the planner sees (never tool results or the assistant's text)
  context: "Athena eClass, a university learning platform (courses, forum, assignments, grades, messages)"

tools:
  # ---------------------------------------------------------------- users
  list_users:
    effect: read
    allow: {admin: true}
    filter: {admin: [drop_password_hash]}
  get_user:
    effect: read
    bind: {student: [user_ref]}
    allow:
      student: {user_ref: self}
      teacher: {user_ref: "self|student_of_taught"}
      admin: true
    filter: {student: [drop_password_hash, drop_admin_notes], teacher: [public_profile], admin: [drop_password_hash]}
  update_user:
    effect: write
    bind: {student: [user_ref], teacher: [user_ref]}
    allow:
      student: {user_ref: self, fields: [phone, address]}
      teacher: {user_ref: self, fields: [phone, address]}
      admin: true
    locked: true
  reset_password: {effect: write, allow: {admin: true}, locked: true}
  create_user:    {effect: write, allow: {admin: true}, locked: true}
  delete_user:    {effect: write, allow: {admin: true}, locked: true}

  # ---------------------------------------------------------------- courses, materials, forum
  list_courses:
    effect: read
    allow: {student: true, teacher: true, admin: true}
    filter: {student: [my_courses, drop_enrollment_key], teacher: [my_courses, drop_enrollment_key]}
  get_course:
    effect: read
    untrusted_output: course_teacher
    allow: {student: {course_ref: enrolled}, teacher: {course_ref: taught}, admin: true}
    filter: {student: [visible_only, drop_enrollment_key, drop_students], teacher: [student_names_only]}
  read_forum:
    effect: read
    untrusted_output: {author_field: author, ref: forum_post}
    allow: {student: {course_ref: enrolled}, teacher: {course_ref: taught}, admin: true}
  post_forum:                       # asks by default (communicate); the user may clear the gate
    effect: communicate
    allow: {student: {course_ref: enrolled}, teacher: {course_ref: taught}, admin: true}
  add_material:
    effect: write
    allow: {teacher: {course_ref: taught}, admin: true}
    locked: true
  post_announcement:
    effect: communicate
    allow: {teacher: {course_ref: taught}, admin: true}
    locked: true
  enroll_user:
    effect: write
    allow: {admin: true}
    locked: true

  # ---------------------------------------------------------------- assignments and grades
  list_assignments:
    effect: read
    allow: {student: {course_ref: enrolled}, teacher: {course_ref: taught}, admin: true}
  get_submissions:
    effect: read
    untrusted_output: {author_field: username, ref: submission}
    allow: {student: {assignment_id: enrolled_assignment}, teacher: {assignment_id: taught_assignment}, admin: true}
    filter: {student: [own_rows]}
  submit_assignment:                # asks by default (write); the user may clear the gate
    effect: write
    bind: {student: [student_ref]}
    allow: {student: {assignment_id: enrolled_assignment}}
  grade_submission:
    effect: write
    allow: {teacher: {submission_id: taught_submission}, admin: true}
    locked: true
  get_grades:
    effect: read
    bind: {student: [student_ref]}
    allow: {student: true, teacher: true, admin: true}
    filter: {student: [own_rows, published_only], teacher: [taught_rows]}
  set_final_grade:
    effect: write
    allow: {teacher: {course_ref: taught}, admin: true}
    locked: true
  set_component_grade:
    effect: write
    allow: {teacher: {course_ref: taught}, admin: true}
    locked: true
  publish_grades:
    effect: write
    allow: {teacher: {course_ref: taught}, admin: true}
    locked: true
  get_gradebook:
    effect: read
    allow: {teacher: {course_ref: taught}, admin: true}

  # ---------------------------------------------------------------- exercises / quizzes
  list_exercises:
    effect: read
    allow: {student: {course_ref: enrolled}, teacher: {course_ref: taught}, admin: true}
    filter: {student: [open_only]}
  get_exercise:
    effect: read
    allow: {student: {exercise_id: open_enrolled_exercise}, teacher: {exercise_id: taught_exercise}, admin: true}
    filter: {student: [drop_answers]}
  get_exercise_attempts:
    effect: read
    allow: {student: {exercise_id: enrolled_exercise}, teacher: {exercise_id: taught_exercise}, admin: true}
    filter: {student: [own_rows]}
  submit_exercise:                  # asks by default (write); the user may clear the gate
    effect: write
    bind: {student: [student_ref]}
    allow: {student: {exercise_id: [open_enrolled_exercise, not_attempted]}}

  # ---------------------------------------------------------------- messages
  # design decision: nobody (not even admin) reads other people's messages through the chatbot
  read_messages:
    effect: read
    untrusted_output: {author_field: sender, ref: message}
    bind: {student: [user_ref], teacher: [user_ref], admin: [user_ref]}
    allow: {student: true, teacher: true, admin: true}
  send_message:                     # asks by default (communicate); the user may clear the gate
    effect: communicate
    bind: {student: [from_user], teacher: [from_user], admin: [from_user]}
    allow: {student: true, teacher: true, admin: true}

  # ---------------------------------------------------------------- power tools
  # brief A4: SQL — admin only, SELECT only, always approved. The app's run_sql COMMITS anything that is not
  # a SELECT, so the read_only_sql constraint (adapters/eclass.py) is load-bearing.
  run_sql:
    effect: read
    allow: {admin: {sql: read_only_sql}}
    approval: true
    locked: true
  # design decision: arbitrary URLs are a data-exfiltration channel and there is no sandbox in this
  # deployment. Nobody has it; the model never sees it.
  fetch_url: {effect: external, allow: {}}
